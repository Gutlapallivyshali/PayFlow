spring.application.name=payflow-backend-test

# Test profile H2 in PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:payflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Test-only secret. Never use in production.
payflow.jwt.secret=test-only-secret-key-for-payflow-automated-tests-123456
payflow.jwt.expiration-ms=3600000
payflow.gateway.mock.default-latency-ms=10
payflow.gateway.mock.force-failure=false
