# Development Profile: Embedded H2 database in PostgreSQL mode for zero-setup execution
spring.datasource.url=jdbc:h2:mem:payflow_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Development-only JWT secret. Never use this value in production.
payflow.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-before-deployment-1234567890}