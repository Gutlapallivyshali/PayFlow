spring.application.name=payflow-backend
server.port=8080

# Active Profile (defaults to 'dev' for smooth out-of-the-box local developer startup; use 'prod' for PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA Settings
spring.jpa.open-in-view=false

# Security / JWT Configuration
payflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mock Gateway Settings
payflow.gateway.mock.default-latency-ms=150
payflow.gateway.mock.force-failure=false

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
